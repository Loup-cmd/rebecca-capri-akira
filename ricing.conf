# Rebecca-Capri-Akira — rice Arch autonome, sans Omarchy.
description=Rebecca-Capri-Akira : vintage classe (Art déco, hi-fi, imprimerie) relevé de laiton et de néon. Fond Rebecca avec heure et numéro d'espace dans le lettrage du titre, orange Rebecca / vert-magenta Capri pour le technique, pupitre fin (Utilitaires, batterie, heure), jour/nuit au soleil, shell Quickshell unique, keymap Omarchy native, sans Omarchy
# Tout vient des dépôts officiels Arch (aucun paquet Omarchy, aucun AUR).
packages=quickshell hypridle hyprlock hyprsunset kitty cava jq lua
packages=grim slurp swappy hyprpicker gpu-screen-recorder tesseract tesseract-data-fra tesseract-data-eng
packages=wl-clipboard cliphist brightnessctl playerctl pacman-contrib udiskie libnotify
packages=adw-gtk-theme papirus-icon-theme qt6ct
packages=ttf-ibm-plex ttf-sharetech-mono-nerd noto-fonts-emoji librsvg
# Shader, premier rendu du thème.
setup=./setup.sh
# Dossier privé du ricing (scripts, palettes, modèles, fonds) : suit le ricing.
private=rca
# Sélecteur de « ricing switch » : la palette de commandes du shell.
picker=qs -c rca ipc call launcher open ricings
start=rm -rf ~/.local/state/rca/flags
# Agents polkit laissés par d'autres ricings : le shell fournit le sien.
start=pkill -x lxqt-policykit- ; pkill -x polkit-mate-aut ; pkill -x polkit-gnome-au ; pkill -x hyprpolkitagent ; true
start=~/.config/rca/bin/rca-theme daemon
start=pgrep -f "^wl-paste --type text --watch cliphist" >/dev/null || wl-paste --type text --watch cliphist store
start=pgrep -f "^wl-paste --type image --watch cliphist" >/dev/null || wl-paste --type image --watch cliphist store
start=pgrep -x hyprsunset >/dev/null || hyprsunset
start=hypridle
start=qs -c rca
# Noms de processus (pkill -x, 15 caractères max).
stop=rca-theme
stop=hyprsunset
stop=hypridle
