# Rebecca-Capri-Akira — kitty.
# Couleurs : réécrites par rca-theme au lever et au coucher du soleil.
include ~/.local/state/rca/theme/kitty.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        9.0

# Shader CRT Rebecca (teinte chaude, balayage) et traînée de curseur orange.
custom_shaders rebecca-crt
cursor_trail 1
cursor_trail_color #F74D13
cursor_shape block
cursor_blink_interval 0

# Gagner de la place : pas de marge, pas de décoration, onglets en bas.
window_padding_width 6 8
hide_window_decorations yes
confirm_os_window_close 0
tab_bar_edge bottom
tab_bar_style slant
tab_title_template " {index} · {title} "
enable_audio_bell no

# Raccourcis repris d'Omarchy.
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
