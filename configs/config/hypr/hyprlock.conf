# Verrou de secours, utilisé seulement si le shell Quickshell ne répond pas
# (voir ~/.config/rca/bin/rca-lock). Les couleurs viennent du thème courant.

source = ~/.local/state/rca/theme/hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/state/rca/wallpaper
    blur_passes = 2
    brightness = 0.6
}

label {
    monitor =
    text = POSTE VERROUILLÉ
    color = $accent
    font_size = 14
    font_family = ShureTechMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = ShureTechMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 52
    outline_thickness = 2
    rounding = 0
    inner_color = $bg
    outer_color = $accent
    check_color = $accent
    fail_color = $red
    font_color = $fg
    font_family = ShureTechMono Nerd Font
    placeholder_text = MOT DE PASSE
    fail_text = REFUSÉ ($ATTEMPTS)
    dots_rounding = 0
    position = 0, -80
    halign = center
    valign = center
}
