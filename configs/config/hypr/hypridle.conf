# Veille : écran tamisé, verrou Quickshell, écran éteint, suspension.
# `rca-idle run …` ne fait rien quand le verrouillage auto est coupé
# (SUPER + CTRL + I).

general {
    lock_cmd = ~/.config/rca/bin/rca-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

listener {
    timeout = 240
    on-timeout = ~/.config/rca/bin/rca-idle run brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = ~/.config/rca/bin/rca-idle run loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = ~/.config/rca/bin/rca-idle run hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800
    on-timeout = ~/.config/rca/bin/rca-idle run systemctl suspend
}
