# Réglages du ricing Rebecca-Capri-Akira (clé=valeur).
# Relus à chaque appel des scripts ; aucun redémarrage nécessaire.

# Position pour le lever / coucher du soleil (Paris par défaut).
latitude=48.8566
longitude=2.3522

# Veilleuse (hyprsunset) pendant la période sombre : on / off, et sa température.
nightlight=on
night_temperature=4300

# Thèmes d'icônes GTK selon la période.
icons_light=Papirus-Light
icons_dark=Papirus-Dark

# Villes de l'horloge mondiale (fuseau|libellé).
worldclock=America/Los_Angeles|Los Angeles
worldclock=America/New_York|New York
worldclock=Europe/London|Londres
worldclock=Asia/Tokyo|Tokyo

# Ville de la météo (vide = détection par IP via wttr.in).
weather_location=Paris

# Dossiers de sortie des captures.
screenshots_dir=~/Pictures/Screenshots
recordings_dir=~/Videos/Recordings
